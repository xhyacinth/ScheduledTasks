name: Coze Scheduled Task

on:
  schedule:
    # cron 表达式（UTC时间）
    # - cron: '*/10 * * * *' # 每10分钟执行车场心跳消息
    # - cron: '0 */6 * * *'  # 每6小时执行
    - cron: '0 12,13,14 * * *' # 每天20点、21点和22点执行提醒每日反馈消息
  workflow_dispatch:  # 支持手动触发

jobs:
  trigger-coze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install cozepy
      
      - name: Run Coze Task
        env:
          COZE_TOKEN: pat_8jMuWFBh5HLuLs9r3JYH9TlXoy3890qih2VG9klHhCp2LZzVdOqXQTj5T6OudtZk
          BOT_ID: 7638805151256084523
        run: |
          python scripts/trigger_coze.py
